global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'cliente-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['cliente-service:8080']
  - job_name: 'solicitud-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['solicitud-service:8081']
