spring.application.name=solicitud-service

server.port=8081

spring.config.import=optional:configserver:http://servidor-config:8888

eureka.client.service-url.defaultZone=http://eureka-api-gateway:8761/eureka/

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

cliente.service.url=${CLIENTE_SERVICE_URL:http://localhost:8083}

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest